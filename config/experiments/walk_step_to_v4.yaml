# walk_step_to_v3 with progress paid only up to 1.5 cm/s, fine-tuned from run 2 again.
#
# WHY (11/16/2026). v3 (run 2 + contact friction 0.3-1.5, 30M more) learned to SLIDE fast:
# ~3 cm/s against run 2's ~1.3, with the same ~1 right step per cycle, so all the extra distance
# is sliding, and it stayed up less on ordinary floors. Held out, 24 episodes per friction:
#              mu   0.3  0.5  0.8  1.2  1.5   total
#   run 2   up       8   12   16   20   18    74 / 120
#   v3      up      11   13   10   17   16    67 / 120
# Nothing capped what progress paid, so speed bought with falls was worth it, and fast
# sliding is the behaviour least likely to transfer to a real floor.
#   walk_progress_max_speed: 0.015 m/s -- progress pays only up to run 2's pace (a token bucket,
#   src/environments/real_walking_env.py pay_progress); faster earns nothing, so staying up wins.
# From run 2 (it walks at about this pace), not v3 (it would have to unlearn the slide).
# checkpoint_every keeps a copy every 5M steps (v3 peaked mid-run and only final/ was saved).
#
#   python scripts/train_standing.py --config config/experiments/walk_step_to_v4.yaml --wandb online
#   python scripts/eval_walking.py --run runs/<name> --friction 0.3 0.5 0.8 1.2 1.5
#   (a checkpoint: --which checkpoints/45000000)
# Success: more than run 2's 74/120 up across the five floors, ~1 right step per cycle,
# and at least run 2's 8 and 12 up at mu 0.3 and 0.5.
experiment:
  name: walk_step_to_v4
  base: config/experiments/walk_step_to_v3.yaml
  description: v3 (friction 0.3-1.5) with progress paid only up to 1.5 cm/s, fine-tuned from run 2; checkpoints every 5M.
  hypothesis: Capping the paid speed stops the trade of falls for sliding speed, so the friction range improves survival on every floor.
  tags: [walking, real-robot, flex, reference-gait, finetune, friction]
  resume:
    model: runs/walk_step_to_v2-1114-0940/final/model.zip
    vecnorm: runs/walk_step_to_v2-1114-0940/final/vecnorm.pkl
    timesteps: 60000000
overrides:
  standing:
    walk_progress_max_speed: 0.015
    checkpoint_every: 5000000
