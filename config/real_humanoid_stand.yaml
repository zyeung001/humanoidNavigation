# MEASURED STANDING POSE: the first baseline this robot demonstrably holds.
#
# Three baselines were guessed before this one. v1 took sim's settled stance and the robot
# hung crooked at 13-16 deg. v2 zeroed it to straight. v3 widened the box around straight.
# All three failed, and across ~30M steps the policy pressed against its clamp on waist_yaw
# and the hips trying to reach somewhere the baseline would not let it go -- which is the
# saturation runN measured, on exactly those joints.
#
# On 9/3 the robot stood unaided for 194.8 SECONDS, lean spread 0.18 deg. That pose is the
# baseline here. It is NOT straight: against the newly calibrated zeros it carries
# L_hip_yaw +7.9 deg, waist_pitch +7.1, L_hip_roll +6.2, waist_yaw +4.7, R_hip_roll +3.8.
# This robot does not balance at straight, and until the leg zeros were measured that was
# invisible -- "straight" was mislabelled by those same offsets, so it coincided with a
# balanced pose and nobody could see the two were different things.
#
# Every value fits inside the +-0.20 rad clamp (worst 0.1385), so the policy now STARTS at
# the balance point and spends its envelope correcting around it, rather than spending most
# of it just reaching the pose.
#
# ONE VARIABLE. Only residual_baseline differs from real_humanoid_stand.yaml -- the
# plant (compliant waist, per-servo actuator profiles), clamp, randomisation and rewards
# are identical, so any difference in outcome is attributable to the baseline.
#
# USER RUNS (cumulative; the measured run finished at 110,002,176):
#   python scripts/train_standing.py --config config/real_humanoid_stand.yaml #       --model models/final_real_standing_stand.zip #       --vecnorm models/vecnorm_real_standing_stand.pkl --timesteps 120000000
#
#
# Every standing run before this one trained against a plant that was guessed. On 8/14 all
# 17 joints were excited one at a time and fitted (scripts/deploy/excite_joint.py ->
# scripts/debug/fit_actuator.py, results in config/measured_actuator.yaml), and two of the
# guesses were badly wrong.
#
#   1. actuator_tau_ms was [90, 220]. Measured: 17-94, median 40 on the legs and 22 on the
#      arms. Every policy so far trained against servos two to ten times more sluggish than
#      the ones it has to drive. Dead time survived: 54 ms median against the ~50 ms bench
#      figure, so actuator_delay_ms barely moves.
#
#   2. The waist is not rigid. waist_roll was measured moving 1.37x FARTHER than commanded
#      at 1.05 Hz and collapsing to 0.49 at 2.15 Hz -- a resonance and an anti-resonance,
#      i.e. a compliant bracket between the servo and the torso. A rigid MJCF cannot contain
#      that, which is the best explanation yet for why every policy gated 6/6 in sim and
#      fell in two seconds on hardware. models/humanoid_real_v2_compliant.xml adds it
#      (scripts/debug/make_compliant_waist.py), taking simulated waist_roll from rms 0.508
#      against the measurement to 0.140.
#
# ONE VARIABLE AT A TIME. This config changes the PLANT and nothing else -- the residual
# clamp, baseline, randomisation and rewards are byte-identical to residual2. In particular
# obs_filter stays FALSE even though it is the other principled untried change (it mirrors
# deploy's quantized-encoder jvel, and the jvel staircase is the surviving explanation for
# the 1.96 Hz limit cycle). Enable it in the run AFTER this one, alone. This project has
# been burned repeatedly by compounding causes -- wrong mass, corrupted reads and a raised
# servo gain were all live at once in June, and each fix looked useless because the others
# still forced the failure.
#
# CAVEAT, stated because it will matter when reading the result: the compliant model
# contains the phenomenon but does not yet reproduce it exactly. Its resonance sits ~20%
# high in frequency and its anti-resonance is shallower and late. A policy that survives
# this plant is not thereby proven on the real one.
#
# USER RUNS (cumulative; residual2 finished at 100,024,320):
#   python scripts/train_standing.py --config config/real_humanoid_stand.yaml #       --model models/final_real_standing_stand.zip #       --vecnorm models/vecnorm_real_standing_stand.pkl --timesteps 110000000
#
#
# WHY (7/30 tether run runI): residual v1 was a clear control win — 17 s on a slack tether
# (previous unassisted best ~2 s), |av| 0.34 vs 0.7-1.0, d_act halved, glitches 5% — but it
# hung on the tether CROOKED: steady ~13-16 deg lean it never centered. Root cause: v1's
# baseline was sim's measured settled stance (waist_yaw −0.505 = 29 deg twist, R_hip_pitch
# +0.297 = 85% of its joint limit, asymmetric hip yaws). Sim says that stance balances; the
# real robot says it does not — the policy can only act within ±0.2 rad of a structurally
# leaning anchor. Sim's exotic stances inherit every model error; a SYMMETRIC STRAIGHT
# baseline is robust to lateral model error, matches the hand-zeroed servo centers, and
# stands frozen in sim (500/500, tilt 0.999 — more upright than the v1 baseline's 0.96).
#
# THREE changes vs v1:
#   1. residual_baseline = zeros (straight). Verified statically stable in sim 7/30.
#   2. residual_baseline_rand 0.05: each episode shifts the baseline (and clamp box) by a
#      uniform ±0.05 rad (~3 deg) offset — the policy must find true vertical from
#      proj_grav instead of trusting the anchor, which is exactly the sim-vs-real static
#      discrepancy runI exposed. Also makes deploy --trim (on-robot static calibration,
#      joint=degrees) in-distribution.
#   3. bias_jpos widened 0.02 -> 0.04 (encoder-zero error is part of the same discrepancy).
#
# NOTE the v1 policy does NOT transfer by yaml edit alone: shifting the box breaks it in
# sim (falls at step 276/500) because its habits live in the old box (waist_yaw boxes are
# disjoint). This resumes the v1 residual model — nearest weights — and retrains ~10M.
#
# Resumes the RESIDUAL v1 model (90,021,888 steps; --timesteps is CUMULATIVE so 100M adds ~10M):
#   python scripts/train_standing.py --config config/real_humanoid_stand.yaml \
#     --model models/final_real_standing_residual.zip \
#     --vecnorm models/vecnorm_real_standing_residual.pkl \
#     --timesteps 100000000
#
# GATES before deploying: scripts/gate_standing_kick.py at lin 0.15 / yaw 0.5 with THIS
# config, then export npz, md5-push, deploy with
#   --residual-config config/real_humanoid_stand.yaml  (+ --trim as needed on robot).

standing:
  # ========== ENVIRONMENT ==========
  xml_file: models/humanoid_real_v2_compliant.xml   # measured waist compliance
  seed: 42
  n_envs: 12
  device: cuda
  max_episode_steps: 5000

  # ========== OBSERVATION (deployable proprioceptive, 228-dim) ==========
  proprioceptive_obs: true
  obs_foot_contact: false
  obs_history: 4
  obs_include_com: false
  obs_feature_norm: false

  # ========== RESIDUAL MODE v2 ==========
  residual_clamp: 0.2
  residual_baseline: [+0.0667, +0.0462, -0.0667, -0.0103, +0.1077, +0.1385, +0.0103, -0.0410, +0.0462, +0.1231, +0.0821, +0.0000, -0.0000, +0.0000, +0.0000, -0.0000, +0.0000]
  # ^ the 194.8 s standing pose, measured on hardware 9/3, in calibrated
  #   sim radians. Legs and waist are the pose that held; the arms are 0
  #   because they were already on their 8/5 measured centres during it.
  residual_baseline_rand: 0.05

  # ========== ACTION + SMOOTHNESS (unchanged) ==========
  action_smoothing: true
  action_smoothing_tau: 0.3
  action_symmetry: false
  pd_assist: false
  action_rate_penalty: 70.0
  action_rate_cap: 100.0
  raw_action_rate_penalty: 25.0
  raw_action_rate_cap: 50.0
  yaw_rate_penalty: 30.0

  # ========== BALANCED STANCE ==========
  stance_balance_weight: 8.0

  # ========== PUSH-RECOVERY (unchanged from v1) ==========
  push_enabled: true
  push_interval_steps: [60, 150]
  push_lin_vel: 0.15
  push_ang_vel: 0.5

  # ========== CURRICULUM (pinned final stage) ==========
  curriculum_start_stage: 5
  curriculum_max_stage: 5
  curriculum_advance_after: 20
  curriculum_success_rate: 0.60

  # ========== SIM2REAL RANDOMIZATION ==========
  actuator_lag: true
  actuator_delay_ms: [10.0, 80.0]    # measured 14-67 ms across 17 joints, + margin
  actuator_tau_ms: [15.0, 110.0]     # measured 17-94 ms (was [90,220], never measured)
  # PER-SERVO profiles: each joint gets its OWN measured delay and tau, jittered per episode
  # around its own value. Without this every servo in sim is the same servo, which the bench
  # sweep says is false -- L_elbow is 46+17 ms, waist_pitch 52+57. The ranges above remain the
  # fallback for waist_roll, which the profile marks valid:false because it is resonant and a
  # first-order fit does not describe it.
  actuator_profiles: config/measured_actuator.yaml
  actuator_profile_jitter: 0.3

  actuator_rand: true
  actuator_rand_range: [0.7, 1.3]

  domain_rand: true
  curriculum_manage_domain_rand: false
  rand_mass_range: [0.8, 1.2]
  rand_friction_range: [0.6, 1.4]

  obs_noise: true
  noise_projgrav: 0.02
  noise_angvel: 0.05
  noise_jpos: 0.005
  noise_jvel: 0.25
  bias_jpos: 0.04
  bias_angvel: 0.03

  # ========== REWARD ==========
  target_height: 1.40
  height_error_threshold: 0.08
  height_stability_threshold: 0.15
  reward_caps:
    max_height_maintenance_penalty: 15.0
    recovery_bonus_scale: 50.0
    termination_penalty_constant: 50.0

  # ========== PPO (short fine-tune from residual v1) ==========
  total_timesteps: 10_000_000
  learning_rate: 0.0001
  final_learning_rate: 0.00003
  n_steps: 2048
  batch_size: 2048
  n_epochs: 5
  gamma: 0.995
  gae_lambda: 0.95
  clip_range: 0.2
  final_clip_range: 0.1
  ent_coef: 0.004
  final_ent_coef: 0.001
  log_std_max: -1.5
  log_std_min: -2.0
  vf_coef: 0.5
  max_grad_norm: 0.5

  # ========== VECNORMALIZE ==========
  normalize: true
  vecnormalize_clip_obs: 50.0
  vecnormalize_clip_reward: 50.0

  # ========== NETWORK (must match to resume) ==========
  policy_kwargs:
    net_arch:
      - pi: [512, 512, 256]
        vf: [512, 512, 256]
    activation_fn: SiLU
    ortho_init: true

  # ========== LOGGING / CHECKPOINTING (distinct *_stand paths) ==========
  verbose: 1
  log_dir: data/logs/real_standing_stand
  use_tensorboard: true
  n_eval_episodes: 5
  eval_freq: 100_000
  save_freq: 250_000
  checkpoint_dir: data/checkpoints/real_standing_stand
  checkpoint_prefix: real_standing_stand
  best_model_path: models/best_real_standing_stand
  final_model_path: models/final_real_standing_stand
  vecnormalize_path: models/vecnorm_real_standing_stand.pkl
  target_reward_threshold: 5000
  early_stop:
    patience: 5

  random_height_init: false
  random_height_prob: 0.0
  random_height_range: [-0.3, 0.1]

  use_wandb: false
  wandb_project: humanoid_real_standing_stand
  wandb_log_freq: 10000
  video_freq: 500000
  episode_print_freq: 1000
